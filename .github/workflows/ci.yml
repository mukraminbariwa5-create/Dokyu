name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dokyu
          POSTGRES_PASSWORD: dokyu_ci
          POSTGRES_DB: dokyu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dokyu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dokyu:dokyu_ci@localhost:5432/dokyu_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dokyu/server exec prisma generate
      - run: pnpm --filter @dokyu/server exec prisma migrate deploy || pnpm --filter @dokyu/server exec prisma db push
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
