name: Old preview link (GitHub Pages)
# The app now lives at https://dokyu.onrender.com (app + accounts + database).
# The old preview address https://mukraminbariwa5-create.github.io/Dokyu/... sends visitors there,
# keeping the page they asked for, so there is only one app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Dokyu has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://dokyu.onrender.com/">
          <script>
            var p = location.pathname.replace(/^\/Dokyu/, '') || '/';
            location.replace('https://dokyu.onrender.com' + p + location.search + location.hash);
          </script>
          <style>body{font-family:system-ui,sans-serif;display:flex;min-height:90vh;align-items:center;justify-content:center;color:#13287A;text-align:center}</style>
          </head><body><p>Dokyu has moved to <a href="https://dokyu.onrender.com/">dokyu.onrender.com</a>.</p></body></html>
          HTML
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
